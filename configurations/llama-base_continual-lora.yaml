output_dir: "/raid/homes/kajal.negi/workspace/fine_tune_ita/kajal_edits/model"
model_name: "/raid/homes/kajal.negi/workspace/fine_tune_ita/model_fine_ita"
# Lora Config
use_lora: true
lora_r: 8
lora_alpha: 16
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_dropout: 0.05
# Template
response_template: "###Summary:"
prompt_template: "###Text:"
# Training Parameters
training_bs: 2 # this will be needed to create gradient accumulation
micro_training_bs: 2 # per device batch size
evaluation_bs: 2
num_train_epochs: 10
## Optimizer Parameters
weight_decay: 0.005
learning_rate: 2.0e-04
lr_scheduler_type: "linear"
warmup_ratio: 0.1
max_source_len: 6000
max_target_len: 1000
